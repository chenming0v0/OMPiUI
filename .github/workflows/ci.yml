name: CI

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # 第一层：每种系统只构建一次共享依赖，后续任务恢复同一次运行的产物。
  build-deps:
    name: build dependencies ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace

      - name: Build shared workspaces
        run: |
          npm run build -w @ompiui/protocol
          npm run build -w @ompiui/omp-worker
          npm run build -w @ompiui/tui
          npm run build -w @ompiui/relay
          npm run build -w @ompiui/server
          npm run build -w @ompiui/admin

      - uses: actions/upload-artifact@v4
        with:
          name: ci-build-${{ matrix.platform }}
          path: |
            packages/protocol/dist
            packages/omp-worker/dist
            packages/relay/dist
            packages/server/dist
            packages/admin/dist
            packages/tui/dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          overwrite: true

  # 第二层：基础模块、服务端、前端分片和前端构建分别占用独立 runner。
  test-backend:
    name: test ${{ matrix.suite }} ${{ matrix.platform }}
    needs: build-deps
    runs-on: ${{ matrix.platform }}-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows]
        suite: [core]
    env:
      OMPIUI_DRIVER: mock
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          build-artifact: ci-build-${{ matrix.platform }}

      - name: Check and test core workspaces
        if: matrix.suite == 'core'
        run: |
          npm run typecheck -w @ompiui/tui
          npm run typecheck -w @ompiui/relay
          npm run typecheck -w @ompiui/admin
          npm run test -w @ompiui/protocol
          npm run test -w @ompiui/omp-worker
          npm run test -w @ompiui/relay
          npm run test -w @ompiui/admin
          npm run test -w @ompiui/tui

  # server 套件在 Windows 上是 15 倍于 Linux 的病态慢（PTY/子进程 + 逐文件 tsx
  # 编译）；按文件轮转分片到 4 个 runner 并发，和 app 套件同一策略。
  test-server:
    name: test server ${{ matrix.platform }} ${{ matrix.shard }}/4
    needs: build-deps
    runs-on: ${{ matrix.platform }}-latest
    # Windows 的 ConPTY 套件单分片实测可达 14 分钟，15 分钟会被误杀。
    timeout-minutes: ${{ matrix.platform == 'windows' && 25 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows]
        shard: [1, 2, 3, 4]
    env:
      OMPIUI_DRIVER: mock
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          build-artifact: ci-build-${{ matrix.platform }}

      - name: Typecheck server
        if: matrix.shard == 1
        run: npm run typecheck -w @ompiui/server

      - name: Test server shard
        run: npm run test:shard -w @ompiui/server -- ${{ matrix.shard }} 4

  test-omp-interop:
    name: OMP interop ${{ matrix.omp }} ${{ matrix.platform }}
    needs: build-deps
    runs-on: ${{ matrix.platform }}-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows]
        omp: [supported, latest]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          build-artifact: ci-build-${{ matrix.platform }}

      # Supported/latest keep the official standalone binary under test, but
      # stage its exact npm public sources, native dependencies and private Bun.
      - name: Install official OMP binary and matching public runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_TEST_CHANNEL: ${{ matrix.omp }}
        run: |
          if ($env:OMP_TEST_CHANNEL -eq 'supported') {
            $ompTestVersion = node --input-type=module -e "import { OMP_SDK_VERSION } from './packages/omp-worker/dist/omp/constants.js'; console.log(OMP_SDK_VERSION)"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read supported OMP version' }
            $ompTestRelease = "v$ompTestVersion"
          } else {
            $ompTestRelease = gh api repos/can1357/oh-my-pi/releases/latest --jq .tag_name
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve latest OMP release' }
          }
          $ompTestAsset = if ($IsWindows) { 'omp-windows-x64.exe' } else { 'omp-linux-x64' }
          $ompTestName = if ($IsWindows) { 'omp.exe' } else { 'omp' }
          $ompTestDirectory = Join-Path $env:RUNNER_TEMP 'omp-interop-bin'
          New-Item -ItemType Directory -Path $ompTestDirectory -Force | Out-Null
          gh release download $ompTestRelease --repo can1357/oh-my-pi --pattern $ompTestAsset --dir $ompTestDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download official OMP binary' }
          $ompTestBinary = Join-Path $ompTestDirectory $ompTestName
          Move-Item -LiteralPath (Join-Path $ompTestDirectory $ompTestAsset) -Destination $ompTestBinary
          if (-not $IsWindows) {
            chmod +x $ompTestBinary
            if ($LASTEXITCODE -ne 0) { throw 'Cannot make OMP executable' }
          }
          $ompTestVersion = $ompTestRelease -replace '^v', ''
          $ompRuntime = Join-Path $env:RUNNER_TEMP 'omp-interop-runtime'
          node scripts/prepare-omp-runtime.mjs --version $ompTestVersion --out $ompRuntime --binary $ompTestBinary
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare same-version public OMP runtime' }
          "OMPI_OMP_RUNTIME_DIR=$ompRuntime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OMPI_OMP_BIN=$(Join-Path $ompRuntime "bin/$ompTestName")" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Testing official binary and npm public sources from OMP release $ompTestRelease"
          & $ompTestBinary --version
          if ($LASTEXITCODE -ne 0) { throw 'Official OMP binary cannot start' }

      - name: Verify native and migrated session interoperability
        run: node scripts/verify-session-safety.mjs

      - name: Verify native OMP model role configuration
        run: node scripts/verify-model-roles.mjs

      - name: Verify isolated Node and compiled Bun runtime continuation
        run: node scripts/verify-packaged-omp-runtime.mjs --runtime "$OMPI_OMP_RUNTIME_DIR"

  test-omp-config-windows:
    name: OMP npm config windows
    needs: build-deps
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          build-artifact: ci-build-windows
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify Windows entry resolution under Bun
        run: bun test packages/omp-worker/src/omp/omp-config-command.test.ts packages/omp-worker/src/omp/rpc-launch.test.ts

      # 固定 issue #79 的真实 npm 版本，覆盖 Node 与打包 Bun 后端。
      - name: Install npm OMP and verify model role configuration
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'omp npm config'
          npm install --prefix $prefix --no-save --package-lock=false @oh-my-pi/pi-coding-agent@18.8.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install npm OMP fixture' }
          $shim = Join-Path $prefix 'node_modules/.bin/omp.cmd'
          $cli = Join-Path $prefix 'node_modules/@oh-my-pi/pi-coding-agent/dist/cli.js'
          $env:PATH = "$(Join-Path $prefix 'node_modules/.bin');$env:PATH"
          node scripts/verify-model-roles.mjs omp $shim $cli
          if ($LASTEXITCODE -ne 0) { throw 'Node model role round trip failed' }
          bun scripts/verify-model-roles.mjs omp $shim $cli
          if ($LASTEXITCODE -ne 0) { throw 'Bun model role round trip failed' }
          $compiled = Join-Path $env:RUNNER_TEMP 'verify-model-roles.exe'
          bun build scripts/verify-model-roles.mjs --compile --outfile $compiled
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile Bun configuration fixture' }
          & $compiled omp $shim $cli
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Bun model role round trip failed' }
          node scripts/verify-omp-rpc-entry.mjs omp $shim $cli
          if ($LASTEXITCODE -ne 0) { throw 'Node RPC entry verification failed' }
          bun scripts/verify-omp-rpc-entry.mjs omp $shim $cli
          if ($LASTEXITCODE -ne 0) { throw 'Bun RPC entry verification failed' }
          $rpcCompiled = Join-Path $env:RUNNER_TEMP 'verify-omp-rpc-entry.exe'
          bun build scripts/verify-omp-rpc-entry.mjs --compile --outfile $rpcCompiled
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile Bun RPC entry fixture' }
          & $rpcCompiled omp $shim $cli
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Bun RPC entry verification failed' }
          $env:OMPI_OMP_BIN = $shim
          node scripts/verify-session-safety.mjs
          if ($LASTEXITCODE -ne 0) { throw 'npm OMP session interoperability failed' }

  test-app:
    name: test app ${{ matrix.platform }} ${{ matrix.shard }}/4
    needs: build-deps
    runs-on: ${{ matrix.platform }}-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows]
        shard: [1, 2, 3, 4]
    env:
      OMPIUI_DRIVER: mock
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          build-artifact: ci-build-${{ matrix.platform }}
      - name: Test frontend shard
        run: npm run test:run -w @ompiui/app -- --shard=${{ matrix.shard }}/4

  build-app:
    name: build app ${{ matrix.platform }}
    needs: build-deps
    runs-on: ${{ matrix.platform }}-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          build-artifact: ci-build-${{ matrix.platform }}
      # build 已包含完整的前端 TypeScript 检查，无需再单独执行一次。
      - run: npm run build -w @ompiui/app

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
      - run: npm run lint
      - name: Validate release artifact selection
        run: node --test scripts/release/resolve.test.mjs

  # 第三层：保留分支保护使用的检查名称，任何上游失败或跳过都不能放行。
  validate:
    name: validate ${{ matrix.platform }}
    if: always()
    needs: [build-deps, test-backend, test-server, test-omp-interop, test-omp-config-windows, test-app, build-app, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        platform: [ubuntu, windows]
    steps:
      - name: Require all validation jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.JOB_RESULTS)
          const failures = Object.entries(results).filter(([, job]) => job.result !== 'success')
          for (const [name, job] of failures) console.error(`${name}: ${job.result}`)
          if (failures.length) process.exit(1)
          console.log('All validation jobs passed')
          JS

  tauri-check:
    name: tauri check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './packages/app/src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Drop Windows-only patch
        run: rm -f patches/@lydell+node-pty-win32-x64+*.patch

      - run: npm ci

      - name: Prepare empty tauri resources dir
        run: mkdir -p packages/app/src-tauri/resources

      - name: Cargo check
        working-directory: packages/app/src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: packages/app/src-tauri
        run: cargo test --lib
