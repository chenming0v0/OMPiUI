name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan CI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      fingerprint: ${{ steps.route.outputs.fingerprint }}
      verified_run: ${{ steps.route.outputs.verified_run }}
      supported_version: ${{ steps.route.outputs.supported_version }}
      latest_version: ${{ steps.route.outputs.latest_version }}
      omp_matrix: ${{ steps.route.outputs.omp_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Select required checks
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-plan.mjs
      - name: Record full CI source
        if: steps.route.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: ci-source-${{ steps.route.outputs.fingerprint }}-${{ steps.route.outputs.latest_version }}
          path: ${{ runner.temp }}/ci-source.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  # 各任务独立恢复编译缓存，不再等待另一个平台的前置构建。
  test-backend:
    name: test core ${{ matrix.platform }}
    if: needs.plan.outputs.mode == 'full'
    needs: plan
    runs-on: ${{ matrix.platform }}-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows]
    env:
      OMPIUI_DRIVER: mock
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace

      - name: Check and test core workspaces
        run: |
          npm run typecheck -w @ompiui/tui
          npm run typecheck -w @ompiui/relay
          npm run typecheck -w @ompiui/admin
          npm run test -w @ompiui/protocol
          npm run test -w @ompiui/omp-worker
          npm run test -w @ompiui/relay
          npm run test -w @ompiui/admin
          npm run test -w @ompiui/tui

      - name: Lint app and test CI release guards
        if: matrix.platform == 'ubuntu'
        run: |
          npm run lint
          node --test scripts/ci-plan.test.mjs scripts/release/resolve.test.mjs

  # 两片覆盖全部文件；Windows 分片内部仍由 test-shard 保持串行 PTY 测试。
  test-server:
    name: test server ${{ matrix.platform }} ${{ matrix.shard }}/2
    if: needs.plan.outputs.mode == 'full'
    needs: plan
    runs-on: ${{ matrix.platform }}-latest
    timeout-minutes: ${{ matrix.platform == 'windows' && 25 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows]
        shard: [1, 2]
    env:
      OMPIUI_DRIVER: mock
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace

      - name: Typecheck server
        if: matrix.shard == 1
        run: npm run typecheck -w @ompiui/server

      - name: Test server shard
        run: npm run test:shard -w @ompiui/server -- ${{ matrix.shard }} 2

  test-omp-interop:
    name: OMP interop ${{ matrix.omp.channel }} ${{ matrix.platform }}
    if: needs.plan.outputs.mode == 'full'
    needs: plan
    runs-on: ${{ matrix.platform }}-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows]
        omp: ${{ fromJSON(needs.plan.outputs.omp_matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace

      # 两通道版本相同时只验证一次；缓存仍校验官方二进制与同版本公开源码。
      - uses: ./.github/actions/setup-omp-test
        id: omp
        with:
          version: ${{ matrix.omp.version }}

      - name: Verify native and migrated session interoperability
        run: node scripts/verify-session-safety.mjs

      - name: Verify native OMP model role configuration
        run: node scripts/verify-model-roles.mjs

      - name: Verify native per-turn pruning and automatic compaction
        run: node scripts/verify-context-maintenance.mjs

      - name: Verify isolated Node and compiled Bun runtime continuation
        run: node scripts/verify-packaged-omp-runtime.mjs --runtime "$OMPI_OMP_RUNTIME_DIR"

  test-omp-config-windows:
    name: OMP npm roles windows
    if: needs.plan.outputs.mode == 'full'
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: ./.github/actions/setup-omp-npm
        id: fixture
        with:
          version: ${{ needs.plan.outputs.supported_version }}

      - name: Verify Windows entry resolution under Bun
        run: bun test packages/omp-worker/src/omp/omp-config-command.test.ts packages/omp-worker/src/omp/rpc-launch.test.ts

      - name: Verify npm model roles and session safety
        shell: pwsh
        env:
          OMP_TEST_SHIM: ${{ steps.fixture.outputs.shim }}
          OMP_TEST_ENTRY: ${{ steps.fixture.outputs.entry }}
        run: |
          $shim = $env:OMP_TEST_SHIM
          $cli = $env:OMP_TEST_ENTRY
          $env:PATH = "$(Split-Path $shim);$env:PATH"
          node scripts/verify-model-roles.mjs omp $shim $cli
          if ($LASTEXITCODE -ne 0) { throw 'Node model role round trip failed' }
          bun scripts/verify-model-roles.mjs omp $shim $cli
          if ($LASTEXITCODE -ne 0) { throw 'Bun model role round trip failed' }
          $compiled = Join-Path $env:RUNNER_TEMP 'verify-model-roles.exe'
          bun build scripts/verify-model-roles.mjs --compile --outfile $compiled
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile Bun configuration fixture' }
          & $compiled omp $shim $cli
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Bun model role round trip failed' }
          $env:OMPI_OMP_BIN = $shim
          node scripts/verify-session-safety.mjs
          if ($LASTEXITCODE -ne 0) { throw 'npm OMP session interoperability failed' }

  test-omp-rpc-windows:
    name: OMP npm RPC windows
    if: needs.plan.outputs.mode == 'full'
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: ./.github/actions/setup-omp-npm
        id: fixture
        with:
          version: ${{ needs.plan.outputs.supported_version }}
      - name: Verify npm RPC under Node and Bun
        shell: pwsh
        env:
          OMP_TEST_SHIM: ${{ steps.fixture.outputs.shim }}
          OMP_TEST_ENTRY: ${{ steps.fixture.outputs.entry }}
        run: |
          $shim = $env:OMP_TEST_SHIM
          $cli = $env:OMP_TEST_ENTRY
          $env:PATH = "$(Split-Path $shim);$env:PATH"
          node scripts/verify-omp-rpc-entry.mjs omp $shim $cli
          if ($LASTEXITCODE -ne 0) { throw 'Node RPC entry verification failed' }
          bun scripts/verify-omp-rpc-entry.mjs omp $shim $cli
          if ($LASTEXITCODE -ne 0) { throw 'Bun RPC entry verification failed' }
          $compiled = Join-Path $env:RUNNER_TEMP 'verify-omp-rpc-entry.exe'
          bun build scripts/verify-omp-rpc-entry.mjs --compile --outfile $compiled
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile Bun RPC entry fixture' }
          & $compiled omp $shim $cli
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Bun RPC entry verification failed' }


  test-app:
    name: test app ${{ matrix.platform }} ${{ matrix.shard }}/2
    if: needs.plan.outputs.mode == 'full'
    needs: plan
    runs-on: ${{ matrix.platform }}-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu, windows]
        shard: [1, 2]
    env:
      OMPIUI_DRIVER: mock
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
      - name: Build frontend
        if: matrix.shard == 1
        run: npm run build -w @ompiui/app
      - name: Test frontend shard
        run: npm run test:run -w @ompiui/app -- --shard=${{ matrix.shard }}/2


  # 计划跳过与失败分开处理；只有完整成功的检查才生成可复用证明。
  validate:
    name: validate ${{ matrix.platform }}
    if: ${{ !cancelled() }}
    needs: [plan, test-backend, test-server, test-omp-interop, test-omp-config-windows, test-omp-rpc-windows, test-app, tauri-check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        platform: [ubuntu, windows]
    steps:
      - name: Require selected validation jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.JOB_RESULTS)
          const plan = results.plan
          const mode = plan.outputs.mode
          if (plan.result !== 'success' || !['full', 'docs', 'reuse'].includes(mode)) {
            throw new Error(`CI plan did not succeed: ${plan.result}`)
          }
          if (!/^[a-f0-9]{64}$/.test(plan.outputs.fingerprint)) throw new Error('Invalid source fingerprint')
          if (mode === 'reuse' && !plan.outputs.verified_run) throw new Error('No verified CI run supplied')
          const requiredResult = mode === 'full' ? 'success' : 'skipped'
          const failures = Object.entries(results).filter(([name, job]) => name !== 'plan' && job.result !== requiredResult)
          for (const [name, job] of failures) console.error(`${name}: ${job.result}, expected ${requiredResult}`)
          if (failures.length) process.exit(1)
          console.log(mode === 'full' ? 'All validation jobs passed' : `CI checks intentionally skipped: ${mode}`)
          JS
      - uses: actions/checkout@v6
        if: matrix.platform == 'ubuntu' && needs.plan.outputs.mode == 'full'
      - uses: actions/setup-node@v6
        if: matrix.platform == 'ubuntu' && needs.plan.outputs.mode == 'full'
        with:
          node-version: 22
      - name: Write full CI proof
        if: matrix.platform == 'ubuntu' && needs.plan.outputs.mode == 'full'
        env:
          CI_EXPECTED_FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
          CI_LATEST_OMP_VERSION: ${{ needs.plan.outputs.latest_version }}
        run: node scripts/ci-plan.mjs proof
      - name: Record verified source
        if: matrix.platform == 'ubuntu' && needs.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: ci-verified-${{ needs.plan.outputs.fingerprint }}-${{ needs.plan.outputs.latest_version }}
          path: ${{ runner.temp }}/ci-proof.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  tauri-check:
    name: tauri check
    if: needs.plan.outputs.mode == 'full'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './packages/app/src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Drop Windows-only patch
        run: rm -f patches/@lydell+node-pty-win32-x64+*.patch

      - run: npm ci

      - name: Prepare empty tauri resources dir
        run: mkdir -p packages/app/src-tauri/resources

      - name: Cargo check
        working-directory: packages/app/src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: packages/app/src-tauri
        run: cargo test --lib
