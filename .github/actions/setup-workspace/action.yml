name: Set up workspace
description: 安装 Node 依赖并按需恢复当前 CI 的编译产物
inputs:
  build-artifact:
    description: 同一工作流中当前系统的编译产物名称
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    # 非 Windows 环境没有对应的原生包，不能应用 Windows 专属补丁。
    - name: Drop Windows-only patch
      if: runner.os != 'Windows'
      shell: bash
      run: rm -f patches/@lydell+node-pty-win32-x64+*.patch

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Restore workspace builds
      if: inputs.build-artifact != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.build-artifact }}
        # 上传时多个 dist 目录的公共根目录为 packages。
        path: packages
