name: Set up workspace
description: 安装 Node 依赖并缓存共享编译产物，各任务独立启动
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    # 非 Windows 环境没有对应的原生包，不能应用 Windows 专属补丁。
    - name: Drop Windows-only patch
      if: runner.os != 'Windows'
      shell: bash
      run: rm -f patches/@lydell+node-pty-win32-x64+*.patch

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Restore shared workspace builds
      id: shared-builds
      uses: actions/cache@v4
      with:
        path: |
          packages/protocol/dist
          packages/omp-worker/dist
          packages/tui/dist
          packages/relay/dist
          packages/server/dist
          packages/admin/dist
        key: shared-builds-${{ runner.os }}-node22-${{ hashFiles('package.json', 'package-lock.json', 'patches/**', '.github/actions/setup-workspace/action.yml', 'packages/*/package.json', 'packages/*/tsconfig*.json', 'packages/*/scripts/**', 'packages/protocol/src/**', 'packages/omp-worker/src/**', 'packages/tui/src/**', 'packages/relay/src/**', 'packages/server/src/**', 'packages/admin/src/**') }}

    - name: Build shared workspaces on cache miss
      if: steps.shared-builds.outputs.cache-hit != 'true'
      shell: bash
      run: |
        npm run build -w @ompiui/protocol
        npm run build -w @ompiui/omp-worker
        npm run build -w @ompiui/tui
        npm run build -w @ompiui/relay
        npm run build -w @ompiui/server
        npm run build -w @ompiui/admin
